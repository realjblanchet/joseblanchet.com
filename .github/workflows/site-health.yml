name: Daily website health check

on:
  schedule:
    - cron: '41 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the current domain is reachable
        run: curl --fail --head --location --connect-timeout 10 --max-time 20 --retry 1 --retry-delay 5 --silent --show-error --output /dev/null https://joseblanchet.com/
      - name: Check the replacement homepage
        run: |
          curl --fail --location --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --silent --show-error --output home.html https://realjblanchet.github.io/joseblanchet.com/
          grep --fixed-strings --quiet 'Probability, learning, and decisions under uncertainty.' home.html
      - name: Check the publication catalog
        run: |
          curl --fail --location --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --silent --show-error --output publications.html https://realjblanchet.github.io/joseblanchet.com/publications/
          grep --fixed-strings --quiet 'class="result-count"' publications.html
          grep --fixed-strings --quiet 'Last synchronized' publications.html
      - name: Check the funding and support page
        run: |
          curl --fail --location --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --silent --show-error --output grants.html https://realjblanchet.github.io/joseblanchet.com/grant-support/
          grep --fixed-strings --quiet 'Funding &amp; Support' grants.html
          grep --fixed-strings --quiet 'FA9550-20-1-0397' grants.html
      - name: Check the sharing image
        run: curl --fail --location --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --silent --show-error --output /dev/null https://realjblanchet.github.io/joseblanchet.com/og.png
