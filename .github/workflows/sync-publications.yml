name: Synchronize publications

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /joseblanchet.com
      NEXT_PUBLIC_SITE_URL: https://realjblanchet.github.io/joseblanchet.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:publications
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-static.mjs
      - name: Publish validated updates
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "Publication data is unchanged."
            exit 0
          fi
          git config user.name "Blanchet Lab automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json
          git commit -m "chore: synchronize publications"
          git push
